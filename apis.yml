name: Moritz
description: >-
  Moritz is an AI-native law firm delivering commercial, corporate, and
  employment legal work with same-day turnaround at transparent flat-rate
  pricing. Founded in 2025 by Pamir Ehsas (former outside counsel to OpenAI and
  Google) and Stefan Mandaric (ex-Fulbright scholar at MIT), the firm uses AI to
  complete roughly 80% of the work (intake and first draft) with 50+ contracted
  co-counsel lawyers finalizing every matter. Moritz operates across the EU, US,
  and Australia and reports having supported more than 100 companies in closing
  agreements representing over $2B in aggregate contract value. It is a
  Y Combinator (Winter 2026) company that raised a $9M seed round backed by 20VC,
  the Urban Innovation Fund, and 20 unicorn founders. Moritz is a legal-services
  company; it does not currently publish a public API or developer program.
